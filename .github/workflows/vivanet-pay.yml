name: Vivanet Pay

on:
  push:
    paths:
      - "vivanet-pay/**"
      - ".github/workflows/vivanet-pay.yml"
  pull_request:
    paths:
      - "vivanet-pay/**"
      - ".github/workflows/vivanet-pay.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vivanet-pay-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: vivanet-pay

jobs:
  pruebas:
    name: Pruebas (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compilar y probar (incluye pruebas solo-Windows en windows-latest)
        run: mvn -B -ntp verify
      - name: Resumen de pruebas
        if: always()
        shell: bash
        run: |
          cat target/surefire-reports/*.txt 2>/dev/null | grep "Tests run" \
            | awk -F'[:,]' '{t+=$2;f+=$4;e+=$6;s+=$8} END{printf "Pruebas: %d, fallos: %d, errores: %d, omitidas: %d\n",t,f,e,s}' \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Guardar reportes de pruebas
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: reportes-pruebas-${{ matrix.os }}
          path: vivanet-pay/target/surefire-reports/
          retention-days: 14

  vulnerabilidades:
    name: Vulnerabilidades conocidas (OSV)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Listar dependencias que se distribuyen
        run: mvn -B -ntp -q dependency:list -DincludeScope=runtime -Djavafx.platform=win -DoutputFile=target/deps.txt
      - name: Consultar OSV
        run: python3 -I tools/ci/osv_check.py target/deps.txt | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash

  instalador:
    name: Instalador de Windows
    needs: pruebas
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compilar y reunir dependencias
        shell: bash
        run: |
          mvn -B -ntp -DskipTests -Djavafx.platform=win clean package dependency:copy-dependencies \
            -DincludeScope=runtime -DoutputDirectory=target/libs
          cp target/vivanet-pay-*.jar target/libs/
          ls target/libs
      - name: Versión de la aplicación
        id: version
        shell: bash
        run: |
          v=$(mvn -B -ntp -q help:evaluate -Dexpression=project.version -DforceStdout)
          echo "app=${v%%-*}" >> "$GITHUB_OUTPUT"
          echo "jar=vivanet-pay-$v.jar" >> "$GITHUB_OUTPUT"
      - name: Instalar WiX Toolset 3 (requerido por jpackage de JDK 21 para .msi)
        run: choco install wixtoolset --version 3.14.1 -y --no-progress
      - name: Generar instalador .msi
        shell: bash
        run: |
          export PATH="$PATH:/c/Program Files (x86)/WiX Toolset v3.14/bin"
          jpackage --type msi --name VivanetPay --app-version "${{ steps.version.outputs.app }}" \
            --vendor "Vivanet" --description "Vivanet Pay: avisos de transferencias entrantes" \
            --input target/libs --main-jar "${{ steps.version.outputs.jar }}" \
            --main-class com.vivanetpay.ui.Launcher \
            --java-options "-Dfile.encoding=UTF-8" --java-options "-Dvivanet.app=packaged" \
            --win-menu --win-menu-group "Vivanet Pay" --win-shortcut --win-per-user-install --win-dir-chooser \
            --win-upgrade-uuid 6f1c2a4e-3b7d-4c59-9a1e-8d2f5b6c7e90 \
            --dest target/dist
      - name: Generar versión portable (sin instalar)
        shell: bash
        run: |
          jpackage --type app-image --name VivanetPay --app-version "${{ steps.version.outputs.app }}" \
            --vendor "Vivanet" --input target/libs --main-jar "${{ steps.version.outputs.jar }}" \
            --main-class com.vivanetpay.ui.Launcher \
            --java-options "-Dfile.encoding=UTF-8" --java-options "-Dvivanet.app=packaged" \
            --dest target/portable
          (cd target/portable && 7z a -tzip ../dist/VivanetPay-portable.zip VivanetPay > /dev/null)
          ls -l target/dist
      - name: Probar que la versión portable arranca
        shell: pwsh
        run: |
          $exe = "target/portable/VivanetPay/VivanetPay.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--minimized" -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { Write-Error "La aplicación se cerró al arrancar (código $($p.ExitCode))"; exit 1 }
          Stop-Process -Id $p.Id -Force
          Write-Output "La aplicación arrancó y siguió en ejecución 20 s."
      - name: Publicar instalador
        uses: actions/upload-artifact@v5
        with:
          name: VivanetPay-windows
          path: vivanet-pay/target/dist/
          retention-days: 30
