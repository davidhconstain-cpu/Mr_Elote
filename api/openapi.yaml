openapi: 3.0.3
info:
  title: Mr. Elote — API de Pedidos
  version: 1.0.0
  description: 'API REST del sistema de pedidos de Mr. Elote. Basada en la Especificación de Requisitos
    del Producto v1.1 y en database/schema.sql. Convenciones: JSON en camelCase, autenticación JWT Bearer
    salvo donde se indica explícitamente como público, paginación con page/size/sort, y errores con el
    esquema Error.'
  contact:
    name: Mr. Elote
servers:
- url: /api/v1
  description: Prefijo de todas las rutas
security:
- bearerAuth: []
tags:
- name: Auth
  description: Registro, login y sesión
- name: Usuarios
  description: Usuarios, roles y permisos (RBAC)
- name: Clientes
  description: Perfil, direcciones e historial del cliente
- name: Mesas
  description: Mesas y códigos QR
- name: Catálogo
  description: Categorías, productos, opciones, adicionales y combos
- name: Pedidos
  description: Ciclo de vida del pedido
- name: Cocina
  description: Cola de preparación
- name: Pagos
  description: Pagos, webhooks de pasarela y validación manual
- name: Caja
  description: Apertura, movimientos y cierre de caja
- name: Domicilios
  description: Zonas y tarifas de domicilio
- name: Despachos
  description: Asignación y entrega de domicilios
- name: Notificaciones
  description: Avisos al cliente sobre su pedido
- name: Informes
  description: Dashboard y reportes
- name: Auditoría
  description: Bitácora general del sistema
- name: Configuración
  description: Parámetros generales del negocio
paths:
  /auth/registro:
    post:
      summary: Registrar cliente
      tags:
      - Auth
      description: 'RF-002: registro de clientes para pedir fuera del local.


        Endpoint público, sin autenticación.'
      operationId: registrarCliente
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroClienteRequest'
      responses:
        '201':
          description: Cliente creado y autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '422': &id001
          description: Error de validación o regla de negocio (ej. producto agotado, pago no requerido
            validado)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
  /auth/login:
    post:
      summary: Iniciar sesión
      tags:
      - Auth
      description: 'RF-003.


        Endpoint público, sin autenticación.'
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
  /auth/recuperar:
    post:
      summary: Recuperar acceso
      tags:
      - Auth
      description: 'RF-003: envía enlace de recuperación al email.


        Endpoint público, sin autenticación.'
      operationId: recuperarAcceso
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        description: Solo se usa el campo email
      responses:
        '202':
          description: Solicitud aceptada (se envía correo si el email existe)
      security: []
  /auth/refresh:
    post:
      summary: Renovar token
      tags:
      - Auth
      description: '


        Roles autorizados: Cualquier usuario autenticado.'
      operationId: refrescarToken
      responses:
        '200':
          description: Nuevo access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
  /usuarios/me:
    get:
      summary: Ver mi perfil
      tags:
      - Usuarios
      description: '


        Roles autorizados: Cualquier usuario autenticado.'
      operationId: verMiPerfil
      responses:
        '200':
          description: Perfil del usuario autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
    patch:
      summary: Editar mi perfil
      tags:
      - Usuarios
      description: '


        Roles autorizados: Cualquier usuario autenticado.'
      operationId: editarMiPerfil
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Usuario'
      responses:
        '200':
          description: Perfil actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
  /usuarios:
    get:
      summary: Listar usuarios
      tags:
      - Usuarios
      description: 'RF-038.


        Roles autorizados: Administrador.'
      operationId: listarUsuarios
      parameters:
      - &id003
        name: page
        in: query
        required: false
        description: Número de página (0-indexado)
        schema:
          type: integer
          default: 0
      - &id004
        name: size
        in: query
        required: false
        description: Tamaño de página
        schema:
          type: integer
          default: 20
      - &id005
        name: sort
        in: query
        required: false
        description: Campo y dirección de orden, ej. creadoEn,desc
        schema:
          type: string
      - name: rolId
        in: query
        required: false
        description: Filtrar por rol
        schema:
          type: integer
      responses:
        '200':
          description: Listado paginado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaUsuario'
    post:
      summary: Crear usuario de staff
      tags:
      - Usuarios
      description: '


        Roles autorizados: Administrador.'
      operationId: crearUsuario
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Usuario'
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '422': *id001
  /usuarios/{id}:
    get:
      summary: Ver usuario
      tags:
      - Usuarios
      description: '


        Roles autorizados: Administrador.'
      operationId: verUsuario
      parameters:
      - name: id
        in: path
        required: true
        description: ID del usuario
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '404': &id002
          description: Recurso no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      summary: Editar usuario
      tags:
      - Usuarios
      description: '


        Roles autorizados: Administrador.'
      operationId: editarUsuario
      parameters:
      - name: id
        in: path
        required: true
        description: ID del usuario
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Usuario'
      responses:
        '200':
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '404': *id002
    delete:
      summary: Desactivar usuario
      tags:
      - Usuarios
      description: 'Baja lógica (activo=false); nunca se borra físicamente, ver auditoría.


        Roles autorizados: Administrador.'
      operationId: desactivarUsuario
      parameters:
      - name: id
        in: path
        required: true
        description: ID del usuario
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: Usuario desactivado
        '404': *id002
  /roles:
    get:
      summary: Listar roles
      tags:
      - Usuarios
      description: '


        Roles autorizados: Administrador.'
      operationId: listarRoles
      responses:
        '200':
          description: Roles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rol'
  /roles/{id}/permisos:
    put:
      summary: Asignar permisos a un rol
      tags:
      - Usuarios
      description: 'RF-038, RNF-004.


        Roles autorizados: Administrador.'
      operationId: asignarPermisosRol
      parameters:
      - name: id
        in: path
        required: true
        description: ID del rol
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Permiso'
        description: Lista de IDs de permiso
      responses:
        '200':
          description: Permisos actualizados
  /clientes/me/direcciones:
    get:
      summary: Listar mis direcciones
      tags:
      - Clientes
      description: '


        Roles autorizados: Cliente.'
      operationId: listarMisDirecciones
      responses:
        '200':
          description: Direcciones del cliente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Direccion'
    post:
      summary: Agregar dirección
      tags:
      - Clientes
      description: '


        Roles autorizados: Cliente.'
      operationId: crearDireccion
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Direccion'
      responses:
        '201':
          description: Dirección creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Direccion'
  /clientes/me/direcciones/{id}:
    patch:
      summary: Editar dirección
      tags:
      - Clientes
      description: '


        Roles autorizados: Cliente.'
      operationId: editarDireccion
      parameters:
      - name: id
        in: path
        required: true
        description: ID de la dirección
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Direccion'
      responses:
        '200':
          description: Dirección actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Direccion'
        '404': *id002
    delete:
      summary: Eliminar dirección
      tags:
      - Clientes
      description: '


        Roles autorizados: Cliente.'
      operationId: eliminarDireccion
      parameters:
      - name: id
        in: path
        required: true
        description: ID de la dirección
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: Eliminada
        '404': *id002
  /clientes/me/pedidos:
    get:
      summary: Mi historial de pedidos
      tags:
      - Clientes
      description: 'RF-040.


        Roles autorizados: Cliente.'
      operationId: misPedidos
      parameters: &id006
      - *id003
      - *id004
      - *id005
      responses:
        '200':
          description: Historial paginado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaPedido'
  /mesas:
    get:
      summary: Listar mesas
      tags:
      - Mesas
      description: 'RF-024.


        Roles autorizados: Mesero, Administrador.'
      operationId: listarMesas
      responses:
        '200':
          description: Mesas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mesa'
    post:
      summary: Crear mesa
      tags:
      - Mesas
      description: '


        Roles autorizados: Administrador.'
      operationId: crearMesa
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Mesa'
      responses:
        '201':
          description: Mesa creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mesa'
  /mesas/{id}:
    patch:
      summary: Editar mesa
      tags:
      - Mesas
      description: '


        Roles autorizados: Administrador.'
      operationId: editarMesa
      parameters:
      - name: id
        in: path
        required: true
        description: ID de la mesa
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Mesa'
      responses:
        '200':
          description: Mesa actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mesa'
        '404': *id002
  /mesas/{id}/qr/regenerar:
    post:
      summary: Regenerar QR de la mesa
      tags:
      - Mesas
      description: 'Sección 17: desactiva el QR anterior e inserta uno nuevo, sin perder trazabilidad.


        Roles autorizados: Administrador.'
      operationId: regenerarQrMesa
      parameters:
      - name: id
        in: path
        required: true
        description: ID de la mesa
        schema:
          type: integer
          format: int64
      responses:
        '201':
          description: Nuevo QR activo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QrMesa'
  /mesas/qr/{codigo}:
    get:
      summary: Resolver QR de mesa
      tags:
      - Mesas
      description: 'RF-004: identifica la mesa a partir del código escaneado, sin login.


        Endpoint público, sin autenticación.'
      operationId: resolverQrMesa
      parameters:
      - name: codigo
        in: path
        required: true
        description: Código del QR
        schema:
          type: string
      responses:
        '200':
          description: Mesa asociada al QR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mesa'
        '404': *id002
      security: []
  /categorias:
    get:
      summary: Listar categorías
      tags:
      - Catálogo
      description: 'RF-001: visible sin autenticación.


        Endpoint público, sin autenticación.'
      operationId: listarCategorias
      responses:
        '200':
          description: Categorías
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Categoria'
      security: []
    post:
      summary: Crear categoría
      tags:
      - Catálogo
      description: '


        Roles autorizados: Administrador.'
      operationId: crearCategoria
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Categoria'
      responses:
        '201':
          description: Categoría creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Categoria'
  /productos:
    get:
      summary: Listar productos
      tags:
      - Catálogo
      description: 'RF-001, RF-028: incluye agotados con disponible=false.


        Endpoint público, sin autenticación.'
      operationId: listarProductos
      parameters:
      - *id003
      - *id004
      - *id005
      - name: categoriaId
        in: query
        required: false
        description: Filtrar por categoría
        schema:
          type: integer
      - name: disponible
        in: query
        required: false
        description: Filtrar por disponibilidad
        schema:
          type: boolean
      responses:
        '200':
          description: Productos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaProducto'
      security: []
    post:
      summary: Crear producto
      tags:
      - Catálogo
      description: 'RF-025.


        Roles autorizados: Administrador.'
      operationId: crearProducto
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Producto'
      responses:
        '201':
          description: Producto creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Producto'
        '422': *id001
  /productos/{id}:
    get:
      summary: Ver producto
      tags:
      - Catálogo
      description: '


        Endpoint público, sin autenticación.'
      operationId: verProducto
      parameters:
      - name: id
        in: path
        required: true
        description: ID del producto
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Producto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Producto'
        '404': *id002
      security: []
    patch:
      summary: Editar producto
      tags:
      - Catálogo
      description: '


        Roles autorizados: Administrador.'
      operationId: editarProducto
      parameters:
      - name: id
        in: path
        required: true
        description: ID del producto
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Producto'
      responses:
        '200':
          description: Producto actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Producto'
        '404': *id002
  /productos/{id}/disponibilidad:
    patch:
      summary: Marcar disponible/agotado
      tags:
      - Catálogo
      description: 'RF-028, RF-029, RN-004: acción operativa frecuente, separada de editar todo el producto.


        Roles autorizados: Administrador, Cocina.'
      operationId: cambiarDisponibilidadProducto
      parameters:
      - name: id
        in: path
        required: true
        description: ID del producto
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Producto'
        description: Solo se usa el campo disponible
      responses:
        '200':
          description: Disponibilidad actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Producto'
        '404': *id002
  /productos/{id}/imagenes:
    post:
      summary: Agregar imagen de producto
      tags:
      - Catálogo
      description: '


        Roles autorizados: Administrador.'
      operationId: agregarImagenProducto
      parameters:
      - name: id
        in: path
        required: true
        description: ID del producto
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                archivo:
                  type: string
                  format: binary
      responses:
        '201':
          description: Imagen agregada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImagenProducto'
  /adicionales:
    get:
      summary: Listar adicionales
      tags:
      - Catálogo
      description: 'RF-026.


        Endpoint público, sin autenticación.'
      operationId: listarAdicionales
      responses:
        '200':
          description: Adicionales
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Adicional'
      security: []
    post:
      summary: Crear adicional
      tags:
      - Catálogo
      description: '


        Roles autorizados: Administrador.'
      operationId: crearAdicional
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Adicional'
      responses:
        '201':
          description: Adicional creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Adicional'
  /opciones:
    get:
      summary: Listar opciones
      tags:
      - Catálogo
      description: 'RF-026.


        Endpoint público, sin autenticación.'
      operationId: listarOpciones
      responses:
        '200':
          description: Opciones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Opcion'
      security: []
    post:
      summary: Crear opción
      tags:
      - Catálogo
      description: '


        Roles autorizados: Administrador.'
      operationId: crearOpcion
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Opcion'
      responses:
        '201':
          description: Opción creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Opcion'
  /combos:
    get:
      summary: Listar combos
      tags:
      - Catálogo
      description: 'RF-027. disponible se calcula por grupo de componentes (ver combo_disponibilidad).


        Endpoint público, sin autenticación.'
      operationId: listarCombos
      parameters: *id006
      responses:
        '200':
          description: Combos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaCombo'
      security: []
    post:
      summary: Crear combo
      tags:
      - Catálogo
      description: '


        Roles autorizados: Administrador.'
      operationId: crearCombo
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Combo'
      responses:
        '201':
          description: Combo creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Combo'
        '422': *id001
  /combos/{id}/componentes:
    put:
      summary: Definir componentes del combo
      tags:
      - Catálogo
      description: 'Reemplaza la lista completa de combo_detalle del combo.


        Roles autorizados: Administrador.'
      operationId: definirComponentesCombo
      parameters:
      - name: id
        in: path
        required: true
        description: ID del combo
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComboDetalle'
        description: Lista de componentes
      responses:
        '200':
          description: Combo actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Combo'
  /pedidos:
    get:
      summary: Buscar pedidos
      tags:
      - Pedidos
      description: 'RF-044.


        Roles autorizados: Caja, Administrador, Mesero.'
      operationId: buscarPedidos
      parameters:
      - *id003
      - *id004
      - *id005
      - name: estado
        in: query
        required: false
        description: Filtrar por estado
        schema:
          type: string
          enum:
          - creado
          - pago_pendiente
          - pago_validado
          - en_preparacion
          - listo
          - entregado
          - recogido
          - despachado
          - rechazado
          - devuelto
          - no_recibido
          - anulado
      - name: tipo
        in: query
        required: false
        description: Filtrar por tipo
        schema:
          type: string
          enum:
          - local
          - recoger
          - domicilio
      - name: desde
        in: query
        required: false
        description: Fecha inicial
        schema:
          type: string
          format: date
      - name: hasta
        in: query
        required: false
        description: Fecha final
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Pedidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaPedido'
    post:
      summary: Crear pedido
      tags:
      - Pedidos
      description: 'RF-005, RF-006, RF-007: autenticación opcional — un pedido de QR de mesa sin login
        no manda token; un pedido de Cliente o Mesero sí, y el backend lo asocia al usuario autenticado.
        El canal (web/qr/mesero) y el tipo determinan qué campos son obligatorios.


        Roles autorizados: Cliente, Mesero, Invitado con QR de mesa (sin token).'
      operationId: crearPedido
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: Evita crear pedidos duplicados ante reintentos de red (RNF-007)
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearPedidoRequest'
      responses:
