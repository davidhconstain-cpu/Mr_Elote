      description: 'Incluye modulo_domicilios_activo (RF-032).


        Roles autorizados: Administrador.'
      operationId: actualizarConfiguracion
      parameters:
      - name: clave
        in: path
        required: true
        description: Clave del parámetro
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Configuracion'
      responses:
        '200':
          description: Parámetro actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Configuracion'
